<!doctype html>
<!-- Console mode home screen, shown fullscreen by ConsoleMode.cs in WebView2. Keyboard, gamepad and mouse.
     The app calls init(data) and setState(state); the page posts {type:'play'|'exit'}. Opened in a plain browser it shows demo games.
     Skipped: framework, web fonts, online art (covers are local files; a console-colour gradient stands in). Native <dialog> for popups, WebAudio for clicks. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console Home</title>
<style>
:root{--ease:.2s ease-out;--dim:rgba(255,255,255,.62);--acc:#0070d1;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{height:100vh;background:#000;color:#fff;font:16px "Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;overflow:hidden;user-select:none}
body.pad{cursor:none}
#bg{position:fixed;inset:0;transition:filter .3s ease-out,transform .3s ease-out}
#bg.blur{filter:blur(24px) brightness(.45);transform:scale(1.08)}
.bg{position:absolute;inset:-40px;background:center/cover;opacity:0;transition:opacity .35s ease-out;filter:blur(18px) saturate(1.2);transform:scale(1.1)}
.bg.in{opacity:.85}
#shade{position:fixed;inset:0;background:linear-gradient(90deg,#000e,#0000 65%),linear-gradient(0deg,#000e,#0000 55%),linear-gradient(180deg,#0009,#0000 25%)}
main{position:relative;height:100vh;overflow:hidden}
.hero{height:100vh;padding:28px 56px;display:flex;flex-direction:column}
.f{outline:2px solid #fff;outline-offset:4px}
header{display:flex;align-items:center;gap:28px;font-size:22px;min-width:0}
#tabs{display:flex;gap:28px;overflow:hidden;min-width:0}
header .tab{opacity:.6;font-weight:300;border-radius:4px;white-space:nowrap;cursor:pointer}
header .tab.act{opacity:1;font-weight:600}
header .sp{flex:1}
header .ic{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;flex:none;cursor:pointer}
header svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.2}
#clock{font-weight:300;margin-left:4px;flex:none}
#row{display:flex;align-items:center;gap:12px;margin-top:6vh;height:170px;padding-left:14px;overflow:hidden;flex:none}
#row::after{content:"";flex:none;width:100vw}
.tile{width:100px;height:100px;flex:none;border-radius:14px;background:center/cover;transition:transform var(--ease),margin var(--ease),box-shadow var(--ease);display:grid;place-items:center;font-size:26px;font-weight:800;text-shadow:0 1px 3px #000;position:relative;cursor:pointer}
.tile.on{transform:scale(1.3);margin:0 16px}
.tile.on.f{outline:0;box-shadow:0 0 0 3px #fff,0 0 24px 4px #fff9}
.tile.cov{color:transparent;text-shadow:none}
.tile.run::after{content:"";position:absolute;right:6px;top:6px;width:12px;height:12px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 2px #000}
#title{font-size:24px;flex:none;white-space:nowrap;margin-left:-4px}
#meta{margin-top:auto;color:var(--dim);font-size:15px}
#name{font-size:46px;font-weight:300;margin:6px 0 22px;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:16px;align-items:center}
#play{padding:14px 72px;border-radius:26px;background:#fff;color:#000;font-size:18px;font-weight:600;transition:background var(--ease);cursor:pointer}
#play.f{outline:0;background:var(--acc);color:#fff;box-shadow:0 0 0 3px #fff}
#more{width:52px;height:52px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-size:22px;transition:background var(--ease);cursor:pointer}
#more.f{outline:0;background:var(--acc);box-shadow:0 0 0 3px #fff}
#status{color:var(--dim);font-size:14px;margin:18px 0 4vh;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hints{position:fixed;right:56px;bottom:22px;display:flex;gap:26px;font-size:14px;color:var(--dim)}
#hints b{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#ffffffd9;color:#000;font-size:12px;margin-right:8px}
.lower{padding:0 56px 60vh}
.lower h3{font-weight:400;font-size:20px;margin:36px 0 14px;color:var(--dim)}
.lower h3:empty{display:none}
.strip{display:flex;gap:18px;overflow:hidden;padding:14px}
.strip::after{content:"";flex:none;width:100vw}
.card{flex:none;width:240px;height:130px;border-radius:12px;background:#ffffff14 center/cover;padding:16px;display:flex;flex-direction:column;justify-content:space-between;transition:transform var(--ease)}
.card.f{transform:scale(1.04)}
.card small{color:var(--dim)}
.card b{font-size:22px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.game{width:170px;height:170px;justify-content:flex-end;font-size:14px;background-color:#1c2129;cursor:pointer}
.card.game b{font-size:15px;text-shadow:0 1px 4px #000}
dialog{border:0;color:#fff;background:#151a24f2;border-radius:14px;padding:28px;min-width:420px;max-width:70vw;box-shadow:0 20px 60px #000}
dialog::backdrop{background:#0009}
dialog h2{font-weight:300;font-size:28px;margin-bottom:12px}
dialog p{color:var(--dim);line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
#cc{margin:auto 0 0;width:100vw;max-width:none;border-radius:20px 20px 0 0;padding:28px 56px 36px;background:#0b0e1af5}
#cc[open]{animation:up .2s ease-out}
@keyframes up{from{transform:translateY(100%)}}
#cc .strip{padding:12px}
#cc .card{background:#1c2130;width:300px}
#qs{display:flex;gap:22px;margin-top:16px;padding:6px 12px 24px}
#qs div{width:64px;height:64px;border-radius:50%;background:#ffffff1a;display:grid;place-items:center;transition:background var(--ease);position:relative;cursor:pointer}
#qs div.on{background:var(--acc)}
#qs svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2}
#qs span{position:absolute;top:72px;font-size:12px;color:var(--dim);opacity:0;white-space:nowrap}
#qs .f span{opacity:1}
#launch{inset:0;width:100vw;height:100vh;max-width:none;max-height:none;border-radius:0;background:#000 center/cover;place-content:center;text-align:center}
#launch[open]{display:grid}
#launch h2{font-size:56px;text-shadow:0 2px 12px #000}
.bar{width:320px;height:4px;background:#ffffff33;margin:20px auto;border-radius:2px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:#fff;animation:load 2.5s ease-out forwards}
@keyframes load{to{width:100%}}
#empty{position:fixed;inset:0;display:none;place-content:center;text-align:center;gap:12px}
#empty h2{font-weight:300;font-size:40px}
#empty p{color:var(--dim)}
body.none #empty{display:grid}
body.none main{visibility:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="bg"></div><div id="shade"></div>
<main id="main">
  <section class="hero">
    <header id="top">
      <div id="tabs"></div><div class="sp"></div>
      <div class="ic" data-n="Control center"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></div>
      <div class="ic" data-n="Exit"><svg viewBox="0 0 24 24"><path d="M12 2v10M6 6a8 8 0 1012 0"/></svg></div>
      <span id="clock"></span>
    </header>
    <div id="row"></div>
    <div id="meta"></div><div id="name"></div>
    <div class="actions" id="act"><div id="play">Play</div><div id="more">…</div></div>
    <div id="status"></div>
  </section>
  <section class="lower">
    <h3>Details</h3><div class="strip" id="details"></div>
    <h3 id="moreHead"></h3><div class="strip" id="same"></div>
  </section>
</main>
<div id="hints"><span><b>A</b>Select</span><span><b>B</b>Back</span><span><b>☰</b>Control center</span></div>
<div id="empty"><h2>No games yet</h2><p>Add a games folder on the Games tab, then come back.</p><p>B or Esc to leave</p></div>

<dialog id="info"><h2></h2><p></p><p style="margin-top:18px;font-size:13px">A or Esc to close</p></dialog>
<dialog id="launch"><div><h2></h2><div class="bar"><b></b></div><p>Esc to return home</p></div></dialog>
<dialog id="cc"><div class="strip" id="ccCards"></div><div id="qs"></div></dialog>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>`&#${c.charCodeAt(0)};`);
const host=window.chrome?.webview;
const send=m=>host?host.postMessage(m):console.log('to app',m);

// --- data: the app fills it with init(); a plain browser gets demo games
let ALL=[],state={status:'',running:[]};
// cover is a ready URL (file:///… from the app); quotes escaped since art() lands in style attributes.
const art=x=>x.cover?`url("${x.cover.replace(/'/g,'%27').replace(/"/g,'%22')}"),linear-gradient(135deg,${x.color},#000)`:`linear-gradient(135deg,${x.color},#000)`;
const initials=t=>t.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const running=x=>state.running.includes(x.id);

let tabs=[],tab=0,sec=1,idx=[0,0,0,0,0],muted=false,ccSec=0,ccIdx=[0,0];
const SECS=['top','row','act','details','same'];
const games=()=>tabs[tab]?.games||[],g=()=>games()[idx[1]];
const items=s=>s==='top'?[...$('top').querySelectorAll('.tab,.ic')]:[...$(s).children].filter(e=>e.id!=='title');
const clamp=(v,n)=>Math.max(0,Math.min(n-1,v));

function init(data){
  ALL=data.games;state={status:data.status||'',running:data.running||[]};
  document.body.classList.toggle('none',!ALL.length);
  const by=new Map;for(const x of ALL)by.set(x.console,[...(by.get(x.console)||[]),x]);
  // Most-played consoles first; tabs only help when there is more than one.
  tabs=[{name:'Games',games:ALL},...(by.size>1?[...by].sort((a,b)=>b[1].length-a[1].length).map(([name,games])=>({name,games})):[])];
  $('tabs').innerHTML=tabs.map((t,k)=>`<div class="tab${k===tab?' act':''}">${esc(t.name)}</div>`).join('');
  if(!ALL.length)return;
  buildRow();selectGame();draw();
}
function setState(s){state=s;$('status').textContent=s.status;
  items('row').forEach((t,k)=>t.classList.toggle('run',running(games()[k])));
  if(g())$('play').textContent=running(g())?'Stop':'Play';
  if($('cc').open)buildCC();
}

// --- sound: short soft tick
let ac;function tick(f=900){if(muted)return;try{ac??=new AudioContext();const o=ac.createOscillator(),v=ac.createGain(),t=ac.currentTime;
  o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f/2,t+.05);v.gain.setValueAtTime(.05,t);v.gain.exponentialRampToValueAtTime(.001,t+.06);
  o.connect(v).connect(ac.destination);o.start(t);o.stop(t+.07)}catch{}}

// --- background crossfade: stack a new layer, drop old ones after fade
function setBg(img){const d=document.createElement('div');d.className='bg';d.style.backgroundImage=img;$('bg').append(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('in')));
  setTimeout(()=>{while($('bg').children.length>1&&$('bg').firstChild!==d)$('bg').firstChild.remove()},400)}

function buildRow(){$('row').innerHTML=games().map(x=>`<div class="tile${x.cover?' cov':''}${running(x)?' run':''}" style='background-image:${art(x)}'>${esc(initials(x.title))}</div>`).join('')+'<div id="title"></div>'}
function buildLower(){const x=g();
  $('details').innerHTML=[['Play time',x.time],['Last played',x.played],['Console',x.console],['Size',x.size]]
    .map(([a,b])=>`<div class="card"><small>${a}</small><b>${esc(b)}</b></div>`).join('');
  const same=ALL.filter(y=>y.console===x.console&&y!==x).slice(0,12);
  $('moreHead').textContent=same.length?`More ${x.console}`:'';
  $('same').innerHTML=same.map(y=>`<div class="card game" data-id="${y.id}" style='background-image:linear-gradient(0deg,#000b,#0000 50%),${art(y)}'><b>${esc(y.title)}</b></div>`).join('')}
function selectGame(){const x=g();setBg(art(x));$('meta').textContent=`${x.console} · ${x.played}`;$('name').textContent=x.title;
  $('play').textContent=running(x)?'Stop':'Play';buildLower()}

function draw(){
  document.querySelectorAll('main .f').forEach(e=>e.classList.remove('f'));
  const tiles=items('row');tiles.forEach((t,k)=>t.classList.toggle('on',k===idx[1]));
  const sel=tiles[idx[1]];sel.after($('title'));$('title').textContent=g().title;
  $('row').scrollTo({left:Math.max(0,tiles[Math.max(0,idx[1]-1)].offsetLeft-tiles[0].offsetLeft),behavior:'smooth'});
  const s=SECS[sec],it=items(s);idx[sec]=clamp(idx[sec],it.length);it[idx[sec]]?.classList.add('f');
  if(sec>2){const st=$(s),c=it[idx[sec]];st.scrollTo({left:c.offsetLeft-st.firstElementChild.offsetLeft,behavior:'smooth'})}
  $('main').scrollTo({top:sec>2?$(s).offsetTop-140:0,behavior:'smooth'});
  $('bg').classList.toggle('blur',sec>2);
}
function move(dx,dy){
  const before=sec+'/'+idx[sec];
  // Skip empty sections (no "More" games).
  if(dy){let n=sec;do n+=dy;while(n>0&&n<SECS.length&&!items(SECS[n]).length);if(n>=0&&n<SECS.length)sec=n}
  if(dx){idx[sec]=clamp(idx[sec]+dx,items(SECS[sec]).length);if(sec===1&&before!==sec+'/'+idx[sec])selectGame()}
  if(before!==sec+'/'+idx[sec])tick();draw();
}
function info(t,p){$('info').querySelector('h2').textContent=t;$('info').querySelector('p').textContent=p;$('info').showModal()}
function play(){const x=g();send({type:'play',id:x.id});if(running(x))return;
  const d=$('launch');d.style.backgroundImage=`linear-gradient(#0009,#0009),${art(x)}`;d.querySelector('h2').textContent=x.title;
  const b=d.querySelector('.bar b');b.style.animation='none';b.offsetWidth;b.style.animation='';d.showModal();
  clearTimeout(play.t);play.t=setTimeout(()=>d.open&&d.close(),2600)}
function setTab(k){if(k===tab)return;tab=k;document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('act',i===k));idx[1]=0;buildRow();selectGame();draw()}
function jumpTo(id){setTab(0);idx[1]=games().findIndex(x=>x.id===id);sec=1;selectGame();draw()}
function enter(){tick(1300);const s=SECS[sec],el=items(s)[idx[sec]];
  if(s==='top'){if(el.classList.contains('tab'))setTab(items('top').indexOf(el));else if(el.dataset.n==='Exit')send({type:'exit'});else ccOpen()}
  else if(s==='row'||(s==='act'&&idx[2]===0))play();
  else if(s==='act'){const x=g();info(x.title,`${x.console}\nPlay time: ${x.time}\nLast played: ${x.played}\nSize: ${x.size}\n${x.path}`)}
  else if(s==='same')jumpTo(+el.dataset.id);
}

// --- Control Center: what's running, the app's status, and leaving
const QS=[['Home','<path d="M3 11l9-8 9 8v10H3z"/>'],['Mute','<path d="M4 9h4l5-4v14l-5-4H4zM17 9l4 6M21 9l-4 6"/>'],['Exit console mode','<path d="M12 2v10M6 6a8 8 0 1012 0"/>']];
$('qs').innerHTML=QS.map(([n,p])=>`<div data-n="${n}"><svg viewBox="0 0 24 24">${p}</svg><span>${n}</span></div>`).join('');
function buildCC(){const now=ALL.filter(running);
  $('ccCards').innerHTML=[['Now playing',now.map(x=>x.title).join(', ')||'Nothing running'],['Steam Multitool',state.status||'Ready'],['Library',`${ALL.length} game${ALL.length===1?'':'s'}`]]
  .map(([a,b])=>`<div class="card"><small>${a}</small><b>${esc(b)}</b></div>`).join('');if($('cc').open)ccDraw()}
function ccItems(){return [...(ccSec?$('qs'):$('ccCards')).children]}
function ccDraw(){document.querySelectorAll('#cc .f').forEach(e=>e.classList.remove('f'));ccIdx[ccSec]=clamp(ccIdx[ccSec],ccItems().length);ccItems()[ccIdx[ccSec]].classList.add('f')}
function ccOpen(){buildCC();$('cc').showModal();ccDraw();tick(600)}
function ccEnter(){tick(1300);if(!ccSec)return info(...[...ccItems()[ccIdx[0]].children].map(e=>e.textContent));
  const el=ccItems()[ccIdx[1]],n=el.dataset.n;
  if(n==='Home')return $('cc').close();
  if(n==='Exit console mode')return send({type:'exit'});
  muted=!muted;el.classList.toggle('on',muted)}

// --- input: one handler for keyboard and gamepad
const BACK=['Escape','Backspace'];
function handle(k){
  const dir={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]}[k];
  if(k==='F11')return send({type:'exit'});
  if(!ALL.length){if(BACK.includes(k))send({type:'exit'});return}
  if($('info').open||$('launch').open){if(k==='Enter'||BACK.includes(k)){document.querySelector('dialog[open]:not(#cc)').close();tick(600)}return}
  if($('cc').open){
    if(BACK.includes(k)||k==='p')return $('cc').close();
    if(dir){const b=ccSec+'/'+ccIdx[ccSec];if(dir[1])ccSec=clamp(ccSec+dir[1],2);else ccIdx[ccSec]=clamp(ccIdx[ccSec]+dir[0],ccItems().length);if(b!==ccSec+'/'+ccIdx[ccSec])tick();ccDraw()}
    if(k==='Enter')ccEnter();return}
  if(dir)move(...dir);else if(k==='Enter')enter();else if(k==='p')ccOpen();
  // Back walks home: lower sections -> game row -> leave console mode.
  else if(BACK.includes(k)){if(sec!==1){sec=1;tick();draw()}else send({type:'exit'})}
}
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(['ArrowRight','ArrowLeft','ArrowDown','ArrowUp','Enter',' ','Escape','Backspace','p','F11'].includes(k)){e.preventDefault();document.body.classList.add('pad');handle(k===' '?'Enter':k)}});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('cancel',e=>e.preventDefault())); // Esc goes through handle()
addEventListener('mousemove',()=>document.body.classList.remove('pad'));

// mouse: click a tile to select it, again to play; header, buttons and cards act like Enter
addEventListener('click',e=>{const t=e.target.closest('.tile,.tab,.ic,#play,#more,.card.game,#qs div,dialog');if(!t)return;
  if(t.id==='info'||t.id==='launch')return handle('Escape');
  if(t.closest('#qs')){ccSec=1;ccIdx[1]=items('qs').indexOf(t);return ccEnter()}
  if(t.tagName==='DIALOG')return;
  if(t.classList.contains('tile')){const k=items('row').indexOf(t);if(sec===1&&k===idx[1])return play();sec=1;idx[1]=k;selectGame();tick();return draw()}
  const s=t.closest('#top')?0:t.closest('#act')?2:4;sec=s;idx[s]=items(SECS[s]).indexOf(t);draw();enter()});

// gamepad: standard mapping, D-pad 12-15, A=0, B=1, Guide=16, Start=9; left stick as D-pad; held directions repeat
const PAD={12:'ArrowUp',13:'ArrowDown',14:'ArrowLeft',15:'ArrowRight',0:'Enter',1:'Backspace',16:'p',9:'p'};let prev={},next=0;
(function poll(t){for(const gp of navigator.getGamepads?.()||[]){if(!gp)continue;const now={};
  for(const b in PAD)now[PAD[b]]||=!!gp.buttons[b]?.pressed;
  const[x,y]=gp.axes;now.ArrowLeft||=x<-.6;now.ArrowRight||=x>.6;now.ArrowUp||=y<-.6;now.ArrowDown||=y>.6;
  for(const k in now)if(now[k]&&!prev[k]){document.body.classList.add('pad');handle(k);if(k.startsWith('Arrow'))next=t+380}
    else if(now[k]&&k.startsWith('Arrow')&&t>=next){handle(k);next=t+110}
  prev=now;break}
  requestAnimationFrame(poll)})(0);

const clk=()=>$('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});clk();setInterval(clk,1e4);

if(!host){const C={PS2:'#1D3A8A',SWITCH:'#E60012',N64:'#2E8B57',PS1:'#6B7A90'},T=[['Mountain Racer','PlayStation 2','PS2'],['Star Pilots','Nintendo Switch','SWITCH'],['Castle Quest','Nintendo 64','N64'],['Neon Rally','PlayStation 2','PS2'],['Frost Peak','PlayStation','PS1'],['Kart Mayhem','Nintendo Switch','SWITCH'],['Dungeon Deep','Nintendo 64','N64'],['Sky Drift','PlayStation 2','PS2']];
  // Demo box art: an SVG with the title on the console colour.
  const cover=(t,c,k)=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="${c}"/><stop offset="1" stop-color="hsl(${k*67%360} 70% 18%)"/></linearGradient></defs><rect width="300" height="300" fill="url(#g)"/><circle cx="${60+k*29%180}" cy="${90+k*41%120}" r="${70+k*13%60}" fill="#fff2"/><text x="20" y="270" fill="#fff" font-family="sans-serif" font-size="34" font-weight="800">${t}</text></svg>`);
  init({status:'Steam internet allowed',running:[1],games:T.map(([title,console,c],id)=>({id,title,console,color:C[c],cover:id===7?'':cover(title,C[c],id),played:id?'Played yesterday':'Played today',time:`${id*3+1.5} hours`,size:`${((id+1)*1.3).toFixed(1)} GB`,path:`D:\\Games\\${title}.iso`}))})}
</script></body></html>
